<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои боты - SOKOLOV_BOTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-indigo-600">🤖 SOKOLOV_BOTS</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600">Главная</a>
                    <a href="/bots" class="text-gray-700 hover:text-indigo-600">Каталог</a>
                    <a href="/dashboard" class="text-gray-700 hover:text-indigo-600 font-semibold">Мои боты</a>
                    <a href="/logout" class="text-red-600 hover:text-red-700">Выйти</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Мои объявления</h2>
            <a href="/sell" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">+ Добавить бота</a>
        </div>

        {{if .Content}}
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Название</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Цена</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Дата</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Действия</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    {{range .Content}}
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <a href="/bots/{{.ID}}" class="text-indigo-600 hover:underline font-medium">{{.Title}}</a>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">{{.Price}} ₽</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-500">{{.CreatedAt.Format "02.01.2006"}}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <form action="/bots/{{.ID}}/delete" method="POST" style="display:inline;" onsubmit="return confirm('Точно удалить этого бота?');">
                                <button type="submit" class="text-red-600 hover:text-red-900">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
        {{else}}
        <div class="text-center py-12 bg-white rounded-lg shadow">
            <p class="text-gray-500 mb-4">Вы пока не добавили ни одного бота.</p>
            <a href="/sell" class="text-indigo-600 hover:underline font-semibold">Создать первое объявление</a>
        </div>
        {{end}}
    </main>
</body>
</html>
