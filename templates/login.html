<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SOKOLOV_BOTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-indigo-600">🤖 SOKOLOV_BOTS</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600">Главная</a>
                    <a href="/bots" class="text-gray-700 hover:text-indigo-600">Каталог</a>
                    <a href="/register" class="text-gray-700 hover:text-indigo-600">Регистрация</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-4 py-12">
        <h2 class="text-3xl font-bold text-gray-900 mb-8 text-center">Вход</h2>

        {{if .Error}}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/login" class="bg-white p-8 rounded-lg shadow space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">Войти</button>
        </form>

        <p class="text-center mt-4 text-gray-600">
            Нет аккаунта? <a href="/register" class="text-indigo-600 hover:underline">Зарегистрироваться</a>
        </p>
    </main>
</body>
</html>
