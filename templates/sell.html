<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продать бота - SOKOLOV_BOTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
   <nav class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/" class="text-2xl font-bold text-indigo-600">🤖 SOKOLOV_BOTS</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-700 hover:text-indigo-600">Главная</a>
                <a href="/bots" class="text-gray-700 hover:text-indigo-600">Каталог ботов</a>
                {{if .IsAuth}}
                    <span class="text-gray-600">{{.User.Email}}</span>
                    <a href="/sell" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Продать бота</a>
                    <a href="/logout" class="text-red-600 hover:text-red-700">Выйти</a>
                {{else}}
                    <a href="/login" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Войти</a>
                    <a href="/register" class="text-gray-700 hover:text-indigo-600">Регистрация</a>
                {{end}}
            </div>
        </div>
    </div>
</nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h2 class="text-3xl font-bold text-gray-900 mb-8">Добавить бота на продажу</h2>

        <form method="POST" action="/sell" enctype="multipart/form-data" class="bg-white p-8 rounded-lg shadow space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Название бота</label>
                <input type="text" name="title" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Описание</label>
                <textarea name="description" rows="4" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Цена (₽)</label>
                <input type="number" name="price" step="0.01" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ссылка на GitHub (необязательно)</label>
                <input type="url" name="github_url" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Контакт для связи (Telegram, email)</label>
                <input type="text" name="contact_info" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
<div>
    <label class="block text-sm font-medium text-gray-700 mb-1">ZIP-архив с кодом бота</label>
    <input type="file" name="bot_file" accept=".zip" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
</div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">Опубликовать</button>
        </form>
    </main>
</body>
</html>
